<svg width="1440" height="930" viewBox="0 0 1440 930" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f4f7f8; }
    .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #91a3af; }
    .panel-title { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fafb; }
    .panel-subtitle { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #91a3af; }
    .label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e3ebef; }
    .small { font: 600 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9aacb7; }
    .tiny { font: 600 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #788b97; }
  </style>

  <rect width="1440" height="930" fill="#070b10"/>
  <rect x="30" y="28" width="1380" height="874" rx="26" fill="#0b1117" stroke="#22313f"/>

  <text x="64" y="82" class="title">CView 라이브 메뉴: macOS 전용 특색 디자인 3안</text>
  <text x="64" y="112" class="subtitle">네이티브 toolbar / inspector, floating palette, multi-window control room으로 재해석한 라이브 메뉴 보드</text>

  <!-- Option 1 -->
  <g transform="translate(64 154)">
    <rect width="410" height="694" rx="18" fill="#0f171f" stroke="#2c4252"/>
    <text x="24" y="42" class="panel-title">1. Native Inspector Studio</text>
    <text x="24" y="64" class="panel-subtitle">Toolbar + Sidebar + Stage + Inspector</text>

    <rect x="24" y="88" width="362" height="38" rx="10" fill="#19242d" stroke="#314654"/>
    <circle cx="43" cy="107" r="5" fill="#ff5f57"/>
    <circle cx="61" cy="107" r="5" fill="#febc2e"/>
    <circle cx="79" cy="107" r="5" fill="#28c840"/>
    <rect x="104" y="98" width="50" height="18" rx="9" fill="#223240" stroke="#3d5566"/>
    <text x="116" y="111" class="tiny">라이브</text>
    <rect x="168" y="98" width="98" height="18" rx="9" fill="#1e2b35" stroke="#22c55e"/>
    <text x="181" y="111" class="tiny">탐색 · 시청 · 멀티</text>
    <rect x="300" y="98" width="54" height="18" rx="9" fill="#223240" stroke="#3d5566"/>
    <text x="313" y="111" class="tiny">검색</text>

    <rect x="24" y="148" width="88" height="362" rx="12" fill="#121d27" stroke="#2d4354"/>
    <text x="38" y="174" class="label">Sidebar</text>
    <rect x="38" y="194" width="60" height="22" rx="7" fill="#22c55e" opacity=".18" stroke="#22c55e"/>
    <text x="50" y="209" class="tiny">팔로잉</text>
    <rect x="38" y="230" width="60" height="22" rx="7" fill="#1d2a34"/>
    <text x="50" y="245" class="tiny">카테고리</text>
    <rect x="38" y="266" width="60" height="22" rx="7" fill="#1d2a34"/>
    <text x="53" y="281" class="tiny">최근</text>

    <rect x="124" y="148" width="162" height="362" rx="14" fill="#0a1016" stroke="#455b6b"/>
    <text x="146" y="174" class="label">Live Stage</text>
    <rect x="144" y="202" width="122" height="84" rx="12" fill="#1b2a37" stroke="#22c55e"/>
    <rect x="144" y="302" width="56" height="46" rx="8" fill="#1b2a37" stroke="#3f5868"/>
    <rect x="210" y="302" width="56" height="46" rx="8" fill="#1b2a37" stroke="#3f5868"/>
    <rect x="144" y="366" width="122" height="38" rx="9" fill="#14212b" stroke="#31485a"/>
    <text x="163" y="390" class="small">Grid · Focus · Audio</text>

    <rect x="298" y="148" width="88" height="362" rx="12" fill="#121d27" stroke="#2d4354"/>
    <text x="316" y="174" class="label">Inspector</text>
    <rect x="314" y="198" width="56" height="24" rx="8" fill="#22c55e" opacity=".16" stroke="#22c55e"/>
    <text x="328" y="214" class="tiny">채팅</text>
    <rect x="314" y="238" width="56" height="24" rx="8" fill="#1d2a34"/>
    <text x="328" y="254" class="tiny">설정</text>
    <rect x="314" y="278" width="56" height="24" rx="8" fill="#1d2a34"/>
    <text x="328" y="294" class="tiny">도구</text>
    <rect x="314" y="334" width="56" height="74" rx="10" fill="#172532" stroke="#36536a"/>
    <text x="327" y="374" class="tiny">상태</text>

    <rect x="24" y="536" width="362" height="112" rx="14" fill="#121b24" stroke="#2a3d4d"/>
    <text x="44" y="562" class="label">특색</text>
    <text x="44" y="588" class="small">macOS가 기대하는 sidebar, toolbar, inspector 문법</text>
    <text x="44" y="612" class="small">기본 추천: 가장 자연스럽고 구현 리스크가 낮음</text>
    <text x="44" y="636" class="small">toolbar action은 메뉴바 command와 함께 제공</text>
  </g>

  <!-- Option 2 -->
  <g transform="translate(515 154)">
    <rect width="410" height="694" rx="18" fill="#0f171f" stroke="#4a3855"/>
    <text x="24" y="42" class="panel-title">2. Floating Palette Stage</text>
    <text x="24" y="64" class="panel-subtitle">Stage-first + overlay palette / HUD</text>

    <rect x="24" y="88" width="362" height="422" rx="18" fill="#080d12" stroke="#44596a"/>
    <text x="44" y="122" class="label">Full Media Stage</text>
    <rect x="52" y="150" width="306" height="220" rx="16" fill="#14212d" stroke="#6b7280"/>
    <rect x="78" y="176" width="120" height="82" rx="12" fill="#1d2d3b" stroke="#22c55e"/>
    <rect x="212" y="176" width="120" height="82" rx="12" fill="#1d2d3b" stroke="#3f5868"/>
    <rect x="78" y="274" width="120" height="82" rx="12" fill="#1d2d3b" stroke="#3f5868"/>
    <rect x="212" y="274" width="120" height="82" rx="12" fill="#1d2d3b" stroke="#3f5868"/>

    <rect x="118" y="104" width="174" height="32" rx="16" fill="#19242d" fill-opacity=".88" stroke="#64748b"/>
    <text x="146" y="124" class="small">탐색 · 시청 · 멀티</text>

    <rect x="48" y="398" width="142" height="76" rx="14" fill="#16212b" fill-opacity=".92" stroke="#a855f7"/>
    <text x="66" y="424" class="label">Channel Palette</text>
    <text x="66" y="448" class="small">검색 · 최근 · +멀티</text>

    <rect x="218" y="398" width="140" height="76" rx="14" fill="#16212b" fill-opacity=".92" stroke="#f59e0b"/>
    <text x="238" y="424" class="label">Chat HUD</text>
    <text x="238" y="448" class="small">통합채팅 · 상태</text>

    <rect x="24" y="536" width="362" height="112" rx="14" fill="#121b24" stroke="#2a3d4d"/>
    <text x="44" y="562" class="label">특색</text>
    <text x="44" y="588" class="small">영상 stage가 화면을 지배하고 도구는 floating palette</text>
    <text x="44" y="612" class="small">가장 개성 있음: hover, 단축키, command palette 중심</text>
    <text x="44" y="636" class="small">시청 몰입감은 좋지만 accessibility 검증 필요</text>
  </g>

  <!-- Option 3 -->
  <g transform="translate(966 154)">
    <rect width="410" height="694" rx="18" fill="#0f171f" stroke="#284b5f"/>
    <text x="24" y="42" class="panel-title">3. Multi-Window Control Room</text>
    <text x="24" y="64" class="panel-subtitle">Aux windows + Command Palette</text>

    <rect x="52" y="104" width="238" height="214" rx="16" fill="#101922" stroke="#22c55e"/>
    <text x="74" y="134" class="label">Main MultiLive Window</text>
    <rect x="76" y="158" width="82" height="58" rx="10" fill="#1a2a38" stroke="#22c55e"/>
    <rect x="174" y="158" width="82" height="58" rx="10" fill="#1a2a38" stroke="#3f5868"/>
    <rect x="76" y="232" width="82" height="58" rx="10" fill="#1a2a38" stroke="#3f5868"/>
    <rect x="174" y="232" width="82" height="58" rx="10" fill="#1a2a38" stroke="#3f5868"/>

    <rect x="276" y="146" width="86" height="100" rx="14" fill="#15232e" stroke="#f59e0b"/>
    <text x="298" y="174" class="label">Chat</text>
    <text x="300" y="200" class="tiny">Window</text>

    <rect x="38" y="338" width="134" height="88" rx="14" fill="#15232e" stroke="#60a5fa"/>
    <text x="62" y="368" class="label">Network</text>
    <text x="66" y="394" class="tiny">Monitor Window</text>

    <rect x="196" y="338" width="134" height="88" rx="14" fill="#15232e" stroke="#a855f7"/>
    <text x="226" y="368" class="label">Metrics</text>
    <text x="230" y="394" class="tiny">Forwarding</text>

    <rect x="82" y="452" width="246" height="34" rx="17" fill="#1a2530" stroke="#64748b"/>
    <text x="118" y="474" class="small">⌘K Command Palette · 창 열기 · 세션 전환</text>

    <rect x="24" y="536" width="362" height="112" rx="14" fill="#121b24" stroke="#2a3d4d"/>
    <text x="44" y="562" class="label">특색</text>
    <text x="44" y="588" class="small">보조 창과 멀티모니터를 적극 활용하는 macOS workflow</text>
    <text x="44" y="612" class="small">이미 player/chat/network/metrics WindowGroup 자산이 있음</text>
    <text x="44" y="636" class="small">파워유저용 workspace preset으로 적합</text>
  </g>

  <text x="64" y="884" class="subtitle">최종 추천: 1안 Native Inspector Studio를 기본으로, 2안 floating palette와 3안 multi-window preset을 옵션화</text>
</svg>
