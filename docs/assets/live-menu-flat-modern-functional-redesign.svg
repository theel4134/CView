    <rect x="154" y="296" width="94" height="70" rx="6" fill="#121212" stroke="#5b5b5b" stroke-dasharray="5 5"/>
    <text x="184" y="336" class="tiny">Empty</text>

    <rect x="304" y="154" width="128" height="304" fill="#1a1a1a" stroke="#303030"/>
    <text x="322" y="180" class="label">Runbook</text>
    <rect x="322" y="204" width="90" height="26" rx="7" fill="#202020" stroke="#f59e0b"/>
    <text x="348" y="221" class="tiny">Reconnect</text>
    <rect x="322" y="244" width="90" height="26" rx="7" fill="#202020" stroke="#38bdf8"/>
    <text x="346" y="261" class="tiny">Quality</text>
    <rect x="322" y="284" width="90" height="26" rx="7" fill="#202020" stroke="#a855f7"/>
    <text x="350" y="301" class="tiny">Detach</text>
    <rect x="322" y="340" width="90" height="54" rx="7" fill="#181818" stroke="#424242"/>
    <text x="340" y="363" class="tiny">Network</text>
    <text x="342" y="379" class="tiny">Metrics</text>

    <rect x="24" y="494" width="408" height="178" rx="10" fill="#181818" stroke="#303030"/>
    <text x="42" y="522" class="label">내부 개선</text>
    <text x="42" y="550" class="small">SessionHealthSummary: FPS/latency/buffer/reconnect 요약</text>
    <text x="42" y="578" class="small">Quality Policy: 선택/비선택/Grid/Focus 품질 정책</text>
    <text x="42" y="606" class="small">Reconnect Runbook: 재연결/품질 낮춤/분리 액션 묶음</text>
    <text x="42" y="634" class="small">Event Timeline: 최근 버퍼링/재연결/품질 변경 표시</text>
