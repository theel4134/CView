    <rect x="42" y="304" width="78" height="42" rx="6" fill="#202020" stroke="#323232"/>
    <text x="56" y="330" class="tiny">Queue</text>

    <rect x="141" y="154" width="190" height="264" fill="#0d0d0d" stroke="#303030"/>
