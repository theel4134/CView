    <text x="24" y="66" class="panel-subtitle">기본 구조 + 상태 모델 개선</text>

    <rect x="24" y="92" width="408" height="38" rx="8" fill="#202020" stroke="#353535"/>
    <text x="42" y="116" class="small">Live · 탐색 / 시청 / 멀티 · Layout · Command</text>

    <rect x="24" y="154" width="116" height="264" fill="#1a1a1a" stroke="#303030"/>
    <text x="42" y="180" class="label">Shelf</text>
    <rect x="42" y="204" width="78" height="26" rx="6" fill="#111111" stroke="#313131"/>
    <text x="56" y="221" class="tiny">검색</text>
    <rect x="42" y="250" width="78" height="42" rx="6" fill="#202020" stroke="#323232"/>
