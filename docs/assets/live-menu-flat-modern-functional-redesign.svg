    <rect x="252" y="204" width="160" height="44" rx="7" fill="#202020" stroke="#22c55e"/>
    <text x="270" y="231" class="tiny">A + B + C queued</text>
    <rect x="252" y="268" width="160" height="58" rx="7" fill="#181818" stroke="#424242"/>
    <text x="274" y="294" class="tiny">Recommended Set</text>
    <text x="284" y="310" class="tiny">게임 + 토크 4ch</text>
    <rect x="252" y="350" width="160" height="34" rx="8" fill="#111111" stroke="#22c55e"/>
    <text x="304" y="372" class="tiny">Batch Add</text>

    <rect x="24" y="494" width="408" height="178" rx="10" fill="#181818" stroke="#303030"/>
    <text x="42" y="522" class="label">내부 개선</text>
    <text x="42" y="550" class="small">SmartSessionQueue: 후보 저장 후 일괄 멀티 구성</text>
    <text x="42" y="578" class="small">Saved Filters: 정렬/카테고리/검색 조건 저장</text>
    <text x="42" y="606" class="small">Batch Add Result: 실패/중복/오프라인 분리 표시</text>
    <text x="42" y="634" class="small">Chat Sync Policy: 멀티라이브 추가 시 채팅 자동 동기화 옵션</text>
  </g>

  <!-- Option 3 -->
  <g transform="translate(1072 154)">
