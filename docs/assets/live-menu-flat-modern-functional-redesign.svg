    <rect x="44" y="206" width="94" height="70" rx="6" fill="#222222" stroke="#22c55e"/>
    <circle cx="124" cy="224" r="5" fill="#22c55e"/>
    <text x="62" y="246" class="tiny">59 FPS</text>
    <rect x="154" y="206" width="94" height="70" rx="6" fill="#222222" stroke="#f59e0b"/>
